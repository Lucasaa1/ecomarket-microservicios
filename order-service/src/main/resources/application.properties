spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:sqlite:pedidos.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:sqlite:pedidos.db
spring.flyway.baseline-on-migrate=true

catalog.service.url=http://localhost:8081

security.jwt.secret=EcoMarketAuthServiceSecretKeyForJwtTokens2026EcoMarketSpa
security.jwt.expiration-ms=86400000

logging.level.root=INFO
logging.level.com.ecomarket.order=INFO
logging.level.com.ecomarket.order.client.CatalogClient=DEBUG
logging.structured.format.console=logstash

spring.cloud.openfeign.client.config.catalog-service.connectTimeout=3000
spring.cloud.openfeign.client.config.catalog-service.readTimeout=5000
