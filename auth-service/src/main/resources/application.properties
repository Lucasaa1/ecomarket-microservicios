spring.application.name=auth-service
server.port=8080

spring.datasource.url=jdbc:sqlite:usuarios.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:sqlite:usuarios.db
spring.flyway.baseline-on-migrate=true

security.jwt.secret=EcoMarketAuthServiceSecretKeyForJwtTokens2026EcoMarketSpa
security.jwt.expiration-ms=86400000

logging.level.root=INFO
logging.level.com.ecomarket.auth=INFO
logging.structured.format.console=logstash
